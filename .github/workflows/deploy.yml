name: Deploy (Vercel Production)

# Auto-deploy main to Vercel production on every push. The native Vercel↔GitHub
# integration is connected but stopped firing (the Vercel GitHub App lost push
# access to the repo), so this Action is the reliable trigger. It uses the
# Vercel CLI with VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID repo secrets.
#
# If the native integration is ever re-authorized (Vercel → Settings → Git →
# reconnect), this workflow can be deleted (and the VERCEL_* secrets rotated/removed).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: vercel-prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest --prod --yes --token "$VERCEL_TOKEN"
